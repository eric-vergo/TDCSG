name = "TDCSG"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TDCSG", "tdcsg-orbit", "ComparatorSolution"]
testDriver = "«tdcsg-test»"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = true
# Source files carry a licence line and an authors line, without a copyright line.
weak.linter.style.header = false

# The blueprint tool chain, from the eric-vergo forks of Verso Blueprint, Verso and SubVerso (all
# for Lean v4.36.0), pinned to the revisions that Verso Blueprint itself pins. Verso and SubVerso
# are required here, before Verso Blueprint, so that the workspace uses these revisions: a commit of
# Verso's `release/v4.36.0` branch and one of SubVerso's `release/verso-v4.36.0` branch.
[[require]]
name = "subverso"
git = "https://github.com/eric-vergo/subverso"
rev = "4e04c61d96960d5a1461c6c870572ccb8b45a495"

[[require]]
name = "verso"
git = "https://github.com/eric-vergo/verso"
rev = "94cea086b880f61f5b3847d30151b8e5f80e1259"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/eric-vergo/verso-blueprint.git"
rev = "cc82fb88974659b6890997a1975d21f7cd4d280c"

# PILean draws the figures; the Verso adapter puts them in the site, the LeAnTeX adapter typesets
# their labels. The figures library imports PILean directly, so `pilean` is required here rather
# than reached only through Verso Blueprint; both pin the same revision.
[[require]]
name = "pilean"
git = "https://github.com/eric-vergo/PILean"
rev = "08710ac3a706b85c19d6f7a8317df15cfc259d96"

[[require]]
name = "pilean-verso"
git = "https://github.com/eric-vergo/PILean"
rev = "08710ac3a706b85c19d6f7a8317df15cfc259d96"
subDir = "verso"

[[require]]
name = "pilean-leantex"
git = "https://github.com/eric-vergo/PILean"
rev = "08710ac3a706b85c19d6f7a8317df15cfc259d96"
subDir = "leantex"

# Mathlib is required last so that its pins of shared dependencies (ProofWidgets, Plausible)
# take precedence over the blueprint tool chain's when Lake resolves the workspace.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "TDCSG"

# The exact orbit engine: core Lean only, no Mathlib import.
[[lean_lib]]
name = "TDCSGCompute"

[[lean_exe]]
name = "tdcsg-orbit"
root = "TDCSGCompute.Main"

[[lean_lib]]
name = "ComparatorChallenge"
roots = ["Comparator.FiveDisk.Challenge"]

[[lean_lib]]
name = "ComparatorSolution"
roots = ["Comparator.FiveDisk.Solution"]

# The figures of the blueprint, drawn by PILean from exact data: no Mathlib, no Verso. The
# workspace in `figures/` builds and previews them alone.
[[lean_lib]]
name = "TDCSGFigures"

[[lean_exe]]
name = "tdcsg-figure-preview"
root = "TDCSGFigures.Preview"

# The test driver of `lake test`: the self-tests of the orbit engine, and kernel-checked pins of
# words for the figures that neither the figures library nor the blueprint builds.
[[lean_lib]]
name = "TDCSGTests"
roots = ["TDCSGTests.FrameWords"]

[[lean_exe]]
name = "tdcsg-test"
root = "TDCSGTests.Main"

# The blueprint's page of the figures' theorems. It sits at the repository root so that the
# source links of the theorems, which PILean derives from module names, name the right file.
[[lean_lib]]
name = "TDCSGFigureTheorems"

[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = false
weak.linter.style.longLine = false

[[lean_lib]]
name = "TDCSGBlueprint"
srcDir = "blueprint"

[lean_lib.leanOptions]
experimental.module = true
weak.linter.mathlibStandardSet = false
weak.linter.style.longLine = false
weak.verso.blueprint.externalCode.strictResolve = true
# These figures belong to the manual genre. The slide-specific image hint is inapplicable.
weak.verso.slides.warnOnImage = false
