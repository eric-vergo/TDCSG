name: Verify and publish the fivefold proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivefold-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Prepare the Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if ! bwrap --unshare-user --ro-bind / / /bin/true; then
            # Permit user namespaces for bwrap alone on Ubuntu's AppArmor-enabled runner.
            cat > "$RUNNER_TEMP/bwrap.profile" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tdcs-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r "$RUNNER_TEMP/bwrap.profile"
            bwrap --unshare-user --ro-bind / / /bin/true
          fi

      - name: Install the pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Restore compiled project modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/build/lib
          key: fivefold-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            fivefold-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Fetch the imported Mathlib modules and their dependencies
        run: |
          df -h .
          export MATHLIB_CACHE_DIR="$RUNNER_TEMP/tdcsg-mathlib-cache"
          bash scripts/get-mathlib-cache.sh
          # The project uses the unpacked modules for the remainder of this run.
          find "$MATHLIB_CACHE_DIR" -type f -name '*.ltar' -delete
          du -sh .lake/packages/mathlib/.lake
          df -h .

      - name: Build the library and test the orbit engine
        run: |
          lake build
          lake test

      - name: Verify the independent challenge in the Linux sandbox
        run: |
          lake comparator
          bash scripts/check-comparator-negative.sh

      - name: Build and check the illustrated blueprint
        run: |
          lake exe vbp build
          lake exe vbp check | tee "$RUNNER_TEMP/blueprint-check.log"
          tail -n 1 "$RUNNER_TEMP/blueprint-check.log" | jq -e '.ok == true'

      - name: Record the verified revision
        run: |
          jq --arg commit "$GITHUB_SHA" \
             --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             --arg toolchain "$(cat lean-toolchain)" \
             '{status:"passed", $commit, $run_url, $toolchain, theorems:.theorem_names, kernels:["Lean kernel"]}' \
             comparator.json > _out/site/html-multi/verification.json
          python3 scripts/check-pages.py _out/site/html-multi --release

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/site/html-multi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
